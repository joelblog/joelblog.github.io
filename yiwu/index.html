<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Yiwu Trip Manifest</title>
<style>
  :root {
    --paper:      #EFF1F1;
    --surface:    #FDFDFC;
    --surface-2:  #E5E9EA;
    --ink:        #14202B;
    --slate:      #4E5F6B;
    --rule:       #C7D0D4;
    --rule-soft:  #DDE3E5;
    --stamp:      #C0402A;
    --stamp-bg:   #F6E3DE;
    --sugar:      #96682C;
    --sugar-bg:   #F3E9D9;

    --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
    --serif: Charter, "Iowan Old Style", "Palatino Linotype", Georgia, "Times New Roman", serif;

    --measure: 34rem;
    --pad: clamp(1.15rem, 4.5vw, 2.75rem);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:     #101619;
      --surface:   #171F24;
      --surface-2: #1E282E;
      --ink:       #E3E9EA;
      --slate:     #94A5AE;
      --rule:      #2E3A41;
      --rule-soft: #232E34;
      --stamp:     #E97054;
      --stamp-bg:  #2C1B18;
      --sugar:     #D2A15C;
      --sugar-bg:  #251E12;
    }
  }

  :root[data-theme="dark"] {
    --paper:     #101619;
    --surface:   #171F24;
    --surface-2: #1E282E;
    --ink:       #E3E9EA;
    --slate:     #94A5AE;
    --rule:      #2E3A41;
    --rule-soft: #232E34;
    --stamp:     #E97054;
    --stamp-bg:  #2C1B18;
    --sugar:     #D2A15C;
    --sugar-bg:  #251E12;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 17px;
    line-height: 1.62;
    -webkit-text-size-adjust: 100%;
  }

  .sheet {
    max-width: 46rem;
    margin: 0 auto;
    background: var(--surface);
    border-left: 1px solid var(--rule-soft);
    border-right: 1px solid var(--rule-soft);
    min-height: 100vh;
  }

  /* ---------- shared type roles ---------- */

  .label {
    font-family: var(--mono);
    font-size: 0.66rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--slate);
  }

  .num { font-variant-numeric: tabular-nums; }

  p { margin: 0; }
  strong { font-weight: 700; }

  a {
    color: var(--stamp);
    text-underline-offset: 0.18em;
    text-decoration-thickness: 1px;
  }

  :focus-visible {
    outline: 2px solid var(--stamp);
    outline-offset: 3px;
  }

  /* ---------- masthead ---------- */

  header.masthead {
    padding: var(--pad);
    padding-top: clamp(1.75rem, 6vw, 3.25rem);
    border-bottom: 2px solid var(--ink);
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .masthead-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1.5rem;
  }

  h1 {
    font-family: var(--mono);
    font-weight: 700;
    font-size: clamp(1.9rem, 8.5vw, 3.1rem);
    letter-spacing: -0.02em;
    line-height: 1.02;
    margin: 0.55rem 0 0;
    text-transform: uppercase;
    text-wrap: balance;
  }

  .lede {
    margin-top: 0.9rem;
    max-width: var(--measure);
    color: var(--slate);
    font-size: 1.03rem;
  }

  .stamp {
    flex: none;
    border: 1.5px solid var(--stamp);
    color: var(--stamp);
    padding: 0.4rem 0.6rem 0.45rem;
    text-align: center;
    transform: rotate(-3deg);
    font-family: var(--mono);
    line-height: 1.25;
    border-radius: 2px;
  }
  .stamp .cn { font-size: 1.05rem; font-weight: 700; letter-spacing: 0.08em; }
  .stamp .en { font-size: 0.55rem; font-weight: 600; letter-spacing: 0.18em; }

  /* form-field grid in masthead */
  .fields {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(8.5rem, 1fr));
    border-top: 1px solid var(--rule);
    border-left: 1px solid var(--rule);
  }
  .field {
    border-right: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    padding: 0.6rem 0.75rem 0.7rem;
    display: flex;
    flex-direction: column;
    gap: 0.28rem;
  }
  .field .val {
    font-family: var(--mono);
    font-size: 0.95rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .field .val small {
    font-size: 0.72rem;
    font-weight: 400;
    color: var(--slate);
  }

  /* ---------- sections ---------- */

  section {
    padding: clamp(2rem, 7vw, 3.25rem) var(--pad);
    border-bottom: 1px solid var(--rule-soft);
    display: flex;
    flex-direction: column;
    gap: 1.15rem;
  }

  h2 {
    font-family: var(--mono);
    font-size: clamp(1.05rem, 3.6vw, 1.3rem);
    font-weight: 700;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    margin: 0;
    padding-bottom: 0.55rem;
    border-bottom: 1px solid var(--rule);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
  }
  h2 .seq {
    font-size: 0.7rem;
    letter-spacing: 0.16em;
    color: var(--slate);
    font-weight: 600;
  }

  h3 {
    font-family: var(--mono);
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    margin: 0.5rem 0 -0.35rem;
  }

  section > p, section > ul { max-width: var(--measure); }

  ul.prose {
    margin: 0;
    padding-left: 1.1rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  ul.prose li::marker { color: var(--slate); }

  /* ---------- origin story: 3 stages ---------- */

  .stages {
    display: flex;
    flex-direction: column;
    gap: 0;
    border-top: 1px solid var(--rule);
  }
  .stage {
    display: grid;
    grid-template-columns: 2.4rem 1fr;
    gap: 0 0.9rem;
    padding: 0.95rem 0;
    border-bottom: 1px solid var(--rule-soft);
  }
  .stage .yr {
    font-family: var(--mono);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--stamp);
    padding-top: 0.28rem;
  }
  .stage h4 {
    margin: 0 0 0.15rem;
    font-size: 1rem;
    font-weight: 700;
  }
  .stage p { color: var(--slate); font-size: 0.95rem; }

  /* ---------- tables ---------- */

  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--mono);
    font-size: 0.82rem;
    font-variant-numeric: tabular-nums;
    min-width: 20rem;
  }
  th {
    text-align: left;
    font-weight: 600;
    font-size: 0.64rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--slate);
    padding: 0 0.7rem 0.5rem 0;
    border-bottom: 1px solid var(--ink);
    white-space: nowrap;
  }
  td {
    padding: 0.62rem 0.7rem 0.62rem 0;
    border-bottom: 1px solid var(--rule-soft);
    vertical-align: top;
  }
  th:last-child, td:last-child { padding-right: 0; }
  .r { text-align: right; }
  tr.total td {
    border-top: 1.5px solid var(--ink);
    border-bottom: none;
    font-weight: 700;
    padding-top: 0.7rem;
  }
  tr.free td:last-child { color: var(--stamp); }
  td .sub {
    display: block;
    font-family: var(--serif);
    font-size: 0.85rem;
    color: var(--slate);
    line-height: 1.45;
    margin-top: 0.15rem;
  }

  /* ---------- day legs ---------- */

  .leg-head {
    display: flex;
    align-items: baseline;
    gap: 0.8rem;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 0.55rem;
  }
  .leg-head .day {
    font-family: var(--mono);
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    background: var(--ink);
    color: var(--surface);
    padding: 0.24rem 0.5rem;
    border-radius: 2px;
  }
  .leg-head h2 {
    border: none;
    padding: 0;
    flex: 1 1 12rem;
  }

  .timeline {
    display: flex;
    flex-direction: column;
    gap: 0;
    margin-top: 0.3rem;
  }
  .stop {
    display: grid;
    grid-template-columns: 3.6rem 1fr;
    gap: 0 1rem;
    padding: 0.9rem 0;
    border-bottom: 1px solid var(--rule-soft);
  }
  .stop:last-child { border-bottom: none; }
  .stop .t {
    font-family: var(--mono);
    font-size: 0.74rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding-top: 0.24rem;
    color: var(--ink);
    border-right: 1px solid var(--rule);
    padding-right: 0.7rem;
    text-align: right;
  }
  .stop.opt .t { color: var(--slate); font-weight: 400; }
  .stop h4 {
    margin: 0 0 0.3rem;
    font-size: 1.02rem;
    font-weight: 700;
    text-wrap: balance;
  }
  .stop h4 .cn { font-weight: 400; color: var(--slate); }
  .stop p { font-size: 0.95rem; }
  .stop p + p { margin-top: 0.45rem; }

  .tag {
    display: inline-block;
    font-family: var(--mono);
    font-size: 0.58rem;
    font-weight: 700;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    padding: 0.16rem 0.4rem;
    border-radius: 2px;
    vertical-align: 0.14em;
    margin-left: 0.35rem;
    white-space: nowrap;
  }
  .tag.free { background: var(--stamp-bg); color: var(--stamp); }
  .tag.learn { background: var(--sugar-bg); color: var(--sugar); }

  /* ---------- callout ---------- */

  .note {
    border-left: 2px solid var(--stamp);
    background: var(--stamp-bg);
    padding: 0.85rem 1rem;
    font-size: 0.95rem;
    max-width: var(--measure);
    border-radius: 0 2px 2px 0;
  }
  .note .label { color: var(--stamp); display: block; margin-bottom: 0.25rem; }

  /* ---------- checklists ---------- */

  .checks {
    display: flex;
    flex-direction: column;
    gap: 0;
    border-top: 1px solid var(--rule);
  }
  .check {
    display: grid;
    grid-template-columns: 1.4rem 1fr;
    gap: 0 0.75rem;
    align-items: start;
    padding: 0.8rem 0.25rem 0.85rem 0;
    border-bottom: 1px solid var(--rule-soft);
    cursor: pointer;
  }
  .check input {
    appearance: none;
    -webkit-appearance: none;
    width: 1.05rem;
    height: 1.05rem;
    margin: 0.28rem 0 0;
    border: 1.5px solid var(--slate);
    border-radius: 2px;
    background: transparent;
    display: grid;
    place-content: center;
    cursor: pointer;
    flex: none;
  }
  .check input::after {
    content: "";
    width: 0.55rem;
    height: 0.3rem;
    border-left: 2px solid var(--surface);
    border-bottom: 2px solid var(--surface);
    transform: rotate(-45deg) translate(1px, -1px) scale(0);
    transition: transform 0.12s ease-out;
  }
  .check input:checked {
    background: var(--stamp);
    border-color: var(--stamp);
  }
  .check input:checked::after { transform: rotate(-45deg) translate(1px, -1px) scale(1); }
  .check input:checked ~ .ctext { color: var(--slate); text-decoration: line-through; text-decoration-color: var(--rule); }
  .ctext h4 { margin: 0 0 0.2rem; font-size: 1rem; font-weight: 700; }
  .ctext p { font-size: 0.93rem; color: var(--slate); }
  .ctext .ask {
    font-family: var(--mono);
    font-size: 0.86rem;
    color: var(--sugar);
    display: block;
    margin-top: 0.3rem;
  }

  @media (prefers-reduced-motion: reduce) {
    .check input::after { transition: none; }
  }

  /* ---------- concept chips ---------- */

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    max-width: var(--measure);
  }
  .chip {
    font-family: var(--mono);
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    padding: 0.28rem 0.5rem;
    border: 1px solid var(--rule);
    border-radius: 2px;
    color: var(--slate);
    background: var(--surface-2);
  }

  /* ---------- food grid ---------- */

  .food {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr));
    gap: 0;
    border-top: 1px solid var(--rule);
    border-left: 1px solid var(--rule-soft);
  }
  .dish {
    border-right: 1px solid var(--rule-soft);
    border-bottom: 1px solid var(--rule-soft);
    padding: 0.75rem 0.85rem 0.8rem;
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
  }
  .dish .top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.6rem;
  }
  .dish .name { font-weight: 700; font-size: 0.98rem; }
  .dish .price {
    font-family: var(--mono);
    font-size: 0.76rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--stamp);
    white-space: nowrap;
  }
  .dish .desc { font-size: 0.88rem; color: var(--slate); line-height: 1.45; }

  footer {
    padding: 2rem var(--pad) 3rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  footer p { font-size: 0.88rem; color: var(--slate); max-width: var(--measure); }
</style>
<style>
  .gate {
    max-width: 46rem; margin: 0 auto; background: var(--surface);
    border-left: 1px solid var(--rule-soft); border-right: 1px solid var(--rule-soft);
    min-height: 100vh; padding: var(--pad);
    padding-top: clamp(3rem, 14vw, 7rem);
    display: flex; flex-direction: column; gap: 1.1rem;
  }
  .gate h1 { font-size: clamp(1.5rem, 6.5vw, 2.3rem); margin: 0.4rem 0 0; }
  .gate p { color: var(--slate); max-width: var(--measure); }
  .gate form { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 0.4rem; }
  .gate input[type=password] {
    flex: 1 1 12rem; font-family: var(--mono); font-size: 1rem;
    padding: 0.6rem 0.7rem; color: var(--ink); background: var(--paper);
    border: 1px solid var(--rule); border-radius: 2px;
  }
  .gate button {
    font-family: var(--mono); font-size: 0.72rem; font-weight: 700;
    letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer;
    padding: 0.6rem 1.1rem; color: var(--surface); background: var(--stamp);
    border: 1px solid var(--stamp); border-radius: 2px;
  }
  .gate button[disabled] { opacity: 0.55; cursor: default; }
  .gate .msg { font-family: var(--mono); font-size: 0.8rem; color: var(--stamp); min-height: 1.2em; }
</style>
</head>
<body>

<div class="gate" id="gate">
  <span class="label">Trip manifest &middot; 行程单</span>
  <h1>Yiwu</h1>
  <p>This page is private. Enter the password to read it.</p>
  <form id="f">
    <input type="password" id="pw" autocomplete="current-password" aria-label="Password" autofocus>
    <button type="submit" id="go">Unlock</button>
  </form>
  <div class="msg" id="msg"></div>
</div>

<div id="content"></div>
